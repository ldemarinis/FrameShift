<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>FrameShift</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body, #root { height: 100%; }
body { background: #111; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
::-webkit-scrollbar { display: none; }

/* ── Design tokens ── */
:root {
  --coral-50:#FFF0ED; --coral-100:#FFD9D0; --coral-200:#FFB3A0; --coral-300:#FF8C70;
  --coral-400:#FF6A4A; --coral-500:#FF4F35; --coral-600:#E63820; --coral-700:#BF2914;
  --golden-400:#FFBF0F; --golden-500:#F5A800;
  --sky-400:#2BACF5;   --sky-500:#0093E0;
  --teal-400:#1DC4A8;  --teal-500:#00AB90;
  --neutral-0:#FFFFFF; --neutral-50:#FFFBF7; --neutral-100:#F7F2EC;
  --neutral-200:#EDE5DA; --neutral-300:#DDD3C5; --neutral-400:#BEB0A0;
  --neutral-500:#9A8C7C; --neutral-600:#7A6E60; --neutral-700:#5A5048;
  --neutral-800:#3A342E; --neutral-900:#221E1A;
  --bg-base:#FFFBF5; --bg-surface:#FFFFFF;
  --text-primary:var(--neutral-900); --text-secondary:var(--neutral-600);
  --font-display: system-ui, sans-serif;
  --font-body:    system-ui, sans-serif;
  --font-mono:    monospace;
}

/* ── Phone shell ── */
.phone {
  width: 390px; height: 844px;
  background: var(--bg-base);
  border-radius: 48px; overflow: hidden; position: relative;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a;
  display: flex; flex-direction: column;
}
.status-bar {
  height: 44px; background: white;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0;
}
.screen { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.bottom-nav {
  height: 80px; background: rgba(255,251,245,0.92); backdrop-filter: blur(20px);
  border-top: 1px solid var(--neutral-200);
  box-shadow: 0 -2px 16px rgba(255,79,53,0.08);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding-top: 10px; flex-shrink: 0; z-index: 20;
}
.nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; cursor:pointer; padding-top:4px; }
.nav-label { font-size:10px; font-weight:600; color:var(--neutral-400); transition:color 0.15s; }
.nav-item.active .nav-label { color:var(--coral-500); }
.nav-icon { font-size:22px; line-height:1; transition:transform 0.2s; }
.nav-item.active .nav-icon { transform:scale(1.15); }
.fab-wrap { flex:1; display:flex; flex-direction:column; align-items:center; }
.fab {
  width:54px; height:54px; border-radius:50%;
  background: linear-gradient(135deg,#FF4F35,#FFB830);
  box-shadow: 0 4px 16px rgba(255,79,53,0.45);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:white; margin-top:-28px;
  border:3px solid var(--bg-base); cursor:pointer;
}
.fab-label { font-size:10px; font-weight:600; color:var(--neutral-400); margin-top:7px; }

/* ── Screens ── */
.scroll-y { overflow-y: auto; }

/* ── Onboarding ── */
.onboarding { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:48px 28px 36px; }
.onboarding-emoji { font-size:80px; line-height:1; margin-top:20px; }
.onboarding-headline { font-weight:800; font-size:32px; color:white; line-height:1.2; white-space:pre-line; margin-bottom:14px; text-align:center; }
.onboarding-sub { font-size:16px; color:rgba(255,255,255,0.82); line-height:1.6; text-align:center; }
.onboarding-dots { display:flex; gap:6px; margin-bottom:4px; }
.dot { height:6px; border-radius:9999px; background:rgba(255,255,255,0.4); transition:all 0.3s; }
.dot.active { width:20px; background:white; }
.dot.inactive { width:6px; }
.pill-btn {
  border:none; border-radius:9999px; cursor:pointer;
  font-size:16px; font-weight:700; width:100%; padding:15px 0;
  background:white; color:#FF4F35; box-shadow:0 6px 20px rgba(0,0,0,0.15);
}
.back-btn { background:transparent; border:none; color:rgba(255,255,255,0.7); font-size:14px; cursor:pointer; }

/* ── Feed ── */
.top-bar { background:white; border-bottom:1px solid var(--neutral-200); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.wordmark { font-weight:800; font-size:22px; background:linear-gradient(135deg,#FF4F35,#FFB830); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.stories-row { background:white; border-bottom:1px solid var(--neutral-100); padding:12px 16px; flex-shrink:0; display:flex; gap:12px; overflow-x:auto; }
.story-item { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
.story-ring { padding:2px; border-radius:50%; background:linear-gradient(135deg,#FF4F35,#FFB830); }
.story-label { font-size:10px; color:var(--neutral-500); font-weight:500; }
.feed-scroll { flex:1; overflow-y:auto; padding:14px 14px 0; }
.post-card { background:white; border-radius:20px; overflow:hidden; box-shadow:0 2px 12px rgba(255,79,53,0.08); margin-bottom:14px; }
.post-photo { height:200px; position:relative; }
.post-scrim { position:absolute; bottom:0; left:0; right:0; height:60%; background:linear-gradient(transparent,rgba(26,18,10,0.55)); }
.post-body { padding:12px 14px 14px; }
.post-meta { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.post-caption { font-size:14px; color:var(--neutral-700); line-height:1.5; margin-bottom:10px; }
.post-actions { display:flex; gap:16px; }
.action-btn { background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:5px; font-weight:600; font-size:13px; color:var(--neutral-400); padding:0; }
.action-btn.liked { color:#FF4F35; }

/* ── Profile ── */
.profile-header { padding:48px 20px 70px; position:relative; }
.profile-content { padding:0 20px; margin-top:-50px; }
.profile-avatar-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:20px; }
.avatar-ring { padding:3px; border-radius:50%; background:white; box-shadow:0 4px 20px rgba(255,79,53,0.25); margin-bottom:10px; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
.stat-card { background:white; border-radius:16px; padding:14px 10px; text-align:center; box-shadow:0 2px 8px rgba(255,79,53,0.06); }
.stat-n { font-weight:800; font-size:24px; color:var(--coral-500); }
.stat-label { font-size:12px; color:var(--neutral-500); margin-top:2px; }
.photo-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.photo-thumb { aspect-ratio:1; border-radius:12px; }

/* ── Crew ── */
.crew-card { background:white; border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 2px 12px rgba(255,79,53,0.07); }
.crew-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.crew-icon-wrap { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.crew-footer { display:flex; align-items:center; }
.avatar-stack { display:flex; }
</style>
</head>
<body>
<div id="root"></div>
<script src="node_modules/react/umd/react.development.js"></script>
<script src="node_modules/react-dom/umd/react-dom.development.js"></script>
<script>
const e = React.createElement;
const { useState } = React;

/* ── Avatar ── */
const GRADS = {
  hero:   'linear-gradient(135deg,#FF4F35,#FFB830)',
  ocean:  'linear-gradient(135deg,#2BACF5,#00AB90)',
  sunset: 'linear-gradient(135deg,#FF4F35,#FFD246)',
  golden: '#F5A800',
  teal:   '#00AB90',
};
function Avatar({ initial, size = 36, gradient = 'hero', style }) {
  return e('div', {
    style: {
      width: size, height: size, borderRadius: '50%',
      background: GRADS[gradient] ?? gradient,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontWeight: 700, fontSize: size * 0.4, color: 'white',
      flexShrink: 0, ...style,
    }
  }, initial);
}

/* ── Button ── */
function Btn({ children, small, onClick, style }) {
  return e('button', {
    onClick,
    style: {
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      gap: 6, borderRadius: 9999, border: 'none', cursor: 'pointer',
      fontWeight: 700, fontSize: small ? 13 : 15,
      padding: small ? '9px 18px' : '13px 26px',
      background: 'linear-gradient(135deg,#FF4F35,#FF6A4A)',
      color: 'white', boxShadow: '0 4px 14px rgba(255,79,53,0.35)',
      ...style,
    }
  }, children);
}

/* ── Onboarding ── */
const STEPS = [
  { bg: 'linear-gradient(160deg,#FF4F35,#FFB830)', emoji: '📸', headline: 'The best moments,\njust for you and yours.', sub: 'A private feed for the people who matter most.' },
  { bg: 'linear-gradient(160deg,#0093E0,#00AB90)',  emoji: '🔒', headline: 'Completely private.\nAlways.',                sub: 'No algorithms. No strangers. Just your crew.' },
  { bg: 'linear-gradient(160deg,#F5A800,#FF4F35)',  emoji: '✨', headline: 'Drop a moment\nanytime, anywhere.',           sub: 'Photos, videos, milestones — all in one warm place.' },
];
function OnboardingScreen({ onDone }) {
  const [step, setStep] = useState(0);
  const s = STEPS[step];
  return e('div', { className: 'onboarding', style: { background: s.bg, transition: 'background 0.5s' } },
    e('div', { className: 'onboarding-emoji' }, s.emoji),
    e('div', { style: { textAlign: 'center' } },
      e('div', { className: 'onboarding-headline' }, s.headline),
      e('div', { className: 'onboarding-sub' }, s.sub),
    ),
    e('div', { style: { width: '100%', display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center' } },
      e('div', { className: 'onboarding-dots' },
        STEPS.map((_, i) => e('div', { key: i, className: `dot ${i === step ? 'active' : 'inactive'}` }))
      ),
      step < STEPS.length - 1
        ? e('button', { className: 'pill-btn', onClick: () => setStep(s => s + 1) }, 'Next')
        : e('button', { className: 'pill-btn', onClick: onDone }, 'Get started 🎉'),
      step > 0 && e('button', { className: 'back-btn', onClick: () => setStep(s => s - 1) }, 'Back'),
    )
  );
}

/* ── Feed ── */
const POSTS = [
  { id:1, user:'Jamie', initial:'J', gradient:'hero',   time:'Today · 3:42 PM',      caption:'Beach trip finally happened! The water was perfect 🌊', c1:'#FF8C70', c2:'#FFD246', likes:12, comments:3 },
  { id:2, user:'Mom',   initial:'M', gradient:'ocean',  time:'Yesterday · 11:10 AM', caption:'Sunday pancake breakfast tradition continues 🥞',         c1:'#63C6FF', c2:'#4DD9C0', likes:18, comments:7 },
  { id:3, user:'Sam',   initial:'S', gradient:'golden', time:'2 days ago',            caption:'First steps!! I cannot believe this is happening 😭❤️',   c1:'#FFD246', c2:'#FFB830', likes:41, comments:14 },
  { id:4, user:'Riley', initial:'R', gradient:'teal',   time:'3 days ago',            caption:'Sunset from the cabin. We needed this trip.',              c1:'#1DC4A8', c2:'#2BACF5', likes:23, comments:5 },
];
const STORIES = ['J','M','S','R','A','D'].map((i,idx) => ({ initial:i, gradient:['hero','ocean','golden','teal','sunset','hero'][idx], label:['You','Mom','Sam','Riley','Alex','Dad'][idx] }));

function FeedPost({ post }) {
  const [liked, setLiked] = useState(false);
  return e('div', { className: 'post-card' },
    e('div', { className: 'post-photo', style: { background: `linear-gradient(135deg,${post.c1},${post.c2})` } },
      e('div', { className: 'post-scrim' })
    ),
    e('div', { className: 'post-body' },
      e('div', { className: 'post-meta' },
        e(Avatar, { initial: post.initial, size: 34, gradient: post.gradient }),
        e('div', null,
          e('div', { style: { fontWeight: 600, fontSize: 13, color: 'var(--neutral-800)' } }, post.user),
          e('div', { style: { fontFamily: 'monospace', fontSize: 10, color: 'var(--neutral-400)' } }, post.time),
        ),
        e('div', { style: { marginLeft: 'auto', fontSize: 18, color: 'var(--neutral-400)', cursor: 'pointer' } }, '···'),
      ),
      e('div', { className: 'post-caption' }, post.caption),
      e('div', { className: 'post-actions' },
        e('button', { className: `action-btn${liked ? ' liked' : ''}`, onClick: () => setLiked(l => !l) }, `${liked ? '♥' : '♡'} ${post.likes + (liked ? 1 : 0)}`),
        e('button', { className: 'action-btn' }, `💬 ${post.comments}`),
        e('button', { className: 'action-btn', style: { marginLeft: 'auto' } }, '↗ Share'),
      )
    )
  );
}

function FeedScreen() {
  return e('div', { style: { flex:1, overflow:'hidden', display:'flex', flexDirection:'column' } },
    e('div', { className: 'top-bar' },
      e('div', { className: 'wordmark' }, 'FrameShift'),
      e('div', { style: { display:'flex', gap:10, alignItems:'center' } },
        e('div', { style: { width:36, height:36, borderRadius:'50%', background:'var(--coral-50)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:17, position:'relative' } },
          '🔔',
          e('div', { style: { position:'absolute', top:5, right:5, width:8, height:8, background:'#FF4F35', borderRadius:'50%', border:'1.5px solid white' } })
        ),
        e(Avatar, { initial: 'J', size: 36, gradient: 'hero' }),
      )
    ),
    e('div', { className: 'stories-row' },
      STORIES.map((s, i) =>
        e('div', { key: i, className: 'story-item' },
          e('div', { className: 'story-ring' },
            e(Avatar, { initial: s.initial, size: 48, gradient: s.gradient, style: { border: '2px solid white' } })
          ),
          e('div', { className: 'story-label' }, s.label),
        )
      )
    ),
    e('div', { className: 'feed-scroll' },
      POSTS.map(p => e(FeedPost, { key: p.id, post: p }))
    )
  );
}

/* ── Profile ── */
const PHOTO_GRADS = ['#FF8C70,#FFD246','#63C6FF,#4DD9C0','#FFD246,#FFB830','#1DC4A8,#2BACF5','#FF6A4A,#FF8C70','#4DD9C0,#63C6FF'];
function ProfileScreen() {
  return e('div', { className: 'scroll-y', style: { flex:1, background:'var(--bg-base)' } },
    e('div', { className: 'profile-header', style: { background: 'linear-gradient(160deg,#FF4F35,#FFB830)' } },
      e('div', { style: { fontWeight:700, fontSize:17, color:'white', textAlign:'center' } }, 'My Profile')
    ),
    e('div', { className: 'profile-content' },
      e('div', { className: 'profile-avatar-wrap' },
        e('div', { className: 'avatar-ring' }, e(Avatar, { initial: 'J', size: 84, gradient: 'hero' })),
        e('div', { style: { fontWeight:800, fontSize:24, color:'var(--neutral-900)' } }, 'Jamie Rivera'),
        e('div', { style: { fontSize:14, color:'var(--neutral-500)', marginBottom:12 } }, '@jamie · Member since 2024'),
        e(Btn, { small: true }, 'Edit Profile'),
      ),
      e('div', { className: 'stats-grid' },
        [['47','Moments'],['3','Crews'],['284','Reactions']].map(([n, label]) =>
          e('div', { key: label, className: 'stat-card' },
            e('div', { className: 'stat-n' }, n),
            e('div', { className: 'stat-label' }, label),
          )
        )
      ),
      e('div', { style: { fontWeight:700, fontSize:18, color:'var(--neutral-800)', marginBottom:10 } }, 'My Moments'),
      e('div', { className: 'photo-grid' },
        PHOTO_GRADS.map((c, i) =>
          e('div', { key: i, className: 'photo-thumb', style: { background: `linear-gradient(135deg,${c})` } })
        )
      )
    )
  );
}

/* ── Crew ── */
const CREWS = [
  { name:'The Rivera Fam', members:6, last:'Mom posted a new memory', icon:'👨‍👩‍👧‍👦', bg:'linear-gradient(135deg,#FF4F35,#FFB830)', initials:['J','M','D','S','R','A'] },
  { name:'Beach Squad 🏖️', members:4, last:'Riley shared 3 photos',   icon:'🏄',         bg:'linear-gradient(135deg,#2BACF5,#00AB90)', initials:['J','R','K','T'] },
  { name:'College Crew',    members:8, last:'Alex dropped a moment',   icon:'🎓',         bg:'linear-gradient(135deg,#FF4F35,#FFD246)', initials:['J','A','P','L','M','S','K','R'] },
];
const AV_GRADS = ['hero','ocean','golden','teal'];
function CrewScreen() {
  return e('div', { className: 'scroll-y', style: { flex:1, background:'var(--bg-base)' } },
    e('div', { className: 'top-bar' },
      e('div', { style: { fontWeight:800, fontSize:20, color:'var(--neutral-900)' } }, 'My Crews'),
      e(Btn, { small: true }, '+ New'),
    ),
    e('div', { style: { padding: 14 } },
      CREWS.map((crew, i) =>
        e('div', { key: i, className: 'crew-card' },
          e('div', { className: 'crew-header' },
            e('div', { className: 'crew-icon-wrap', style: { background: crew.bg } }, crew.icon),
            e('div', { style: { flex:1 } },
              e('div', { style: { fontWeight:700, fontSize:16, color:'var(--neutral-900)' } }, crew.name),
              e('div', { style: { fontSize:12, color:'var(--neutral-400)', marginTop:2 } }, crew.last),
            )
          ),
          e('div', { className: 'crew-footer' },
            e('div', { className: 'avatar-stack' },
              crew.initials.slice(0, 4).map((init, j) =>
                e(Avatar, { key: j, initial: init, size: 28, gradient: AV_GRADS[j % 4], style: { marginLeft: j > 0 ? -8 : 0, border: '2px solid white' } })
              ),
              crew.members > 4 && e('div', {
                style: { width:28, height:28, borderRadius:'50%', background:'var(--neutral-200)', border:'2px solid white', marginLeft:-8, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:700, color:'var(--neutral-600)' }
              }, `+${crew.members - 4}`)
            ),
            e('div', { style: { marginLeft:'auto', fontFamily:'monospace', fontSize:11, color:'var(--neutral-400)' } }, `${crew.members} members`)
          )
        )
      )
    )
  );
}

/* ── Navigation ── */
function NavItem({ id, label, icon, active, onPress }) {
  return e('div', { className: `nav-item${active ? ' active' : ''}`, onClick: () => onPress(id) },
    e('div', { className: 'nav-icon' }, icon),
    e('div', { className: 'nav-label' }, label),
  );
}

/* ── App ── */
function App() {
  const [screen, setScreen] = useState('onboarding');
  const [tab, setTab] = useState('feed');
  const renderScreen = () => {
    if (screen === 'onboarding') return e(OnboardingScreen, { onDone: () => setScreen('app') });
    if (tab === 'crew')    return e(CrewScreen);
    if (tab === 'profile') return e(ProfileScreen);
    return e(FeedScreen);
  };
  return e('div', { className: 'phone' },
    e('div', { className: 'status-bar' },
      e('span', { style: { fontWeight:600, fontSize:15, color:'var(--neutral-900)' } }, '9:41'),
      e('span', { style: { fontSize:13 } }, '▲▲▲ WiFi 🔋'),
    ),
    e('div', { className: 'screen' }, renderScreen()),
    screen === 'app' && e('div', { className: 'bottom-nav' },
      e(NavItem, { id:'feed',    label:'Feed', icon:'🏠', active: tab==='feed',    onPress: setTab }),
      e(NavItem, { id:'crew',    label:'Crew', icon:'👥', active: tab==='crew',    onPress: setTab }),
      e('div', { className: 'fab-wrap' },
        e('div', { className: 'fab' }, '+'),
        e('div', { className: 'fab-label' }, 'Drop'),
      ),
      e(NavItem, { id:'profile', label:'Me',   icon:'👤', active: tab==='profile', onPress: setTab }),
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
